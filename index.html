<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>وجبة اليوم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:       #faf7f2;
    --surface:  #ffffff;
    --surface2: #f3ede4;
    --border:   #e8dfd2;
    --border2:  #d4c8b8;
    --text:     #2a2118;
    --muted:    #8a7a68;
    --dim:      #c4b8a8;
    --accent:   #c8440c;
    --accent-lt:#fdeee8;
    --green:    #2d7a4a;
    --green-lt: #eaf5ee;
    --radius:   12px;
    --radius-lg:18px;
    --font:     'Cairo', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); color: var(--text); font-family: var(--font); }
  body { min-height: 100vh; }

  .shell { max-width: 520px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }

  /* header */
  header { text-align: center; margin-bottom: 2.5rem; }
  header .eyebrow { font-size: .72rem; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-bottom: .5rem; }
  header h1 { font-size: 2rem; font-weight: 700; color: var(--text); line-height: 1.2; }
  header h1 span { color: var(--accent); }
  .date-badge { display: inline-block; margin-top: .75rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 30px; padding: 5px 14px; font-size: .8rem; color: var(--muted); }

  /* suggestion card */
  .suggestion-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem 1.5rem 1.5rem;
    margin-bottom: 1.25rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .suggestion-card::before {
    content: '';
    position: absolute; top: 0; right: 0; left: 0; height: 4px;
    background: var(--accent);
  }
  .meal-label { font-size: .72rem; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin-bottom: .6rem; }
  .meal-name {
    font-size: 1.8rem; font-weight: 700; color: var(--text);
    line-height: 1.3; margin-bottom: 1.5rem;
  }
  .meal-name.animating { animation: pop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { from { opacity:0; transform: scale(.88) translateY(8px); } to { opacity:1; transform: none; } }

  .actions { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 11px 8px;
    border-radius: var(--radius); border: 1.5px solid var(--border2);
    font-family: var(--font); font-size: .9rem; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .btn-confirm {
    background: var(--green); color: #fff; border-color: var(--green);
  }
  .btn-confirm:hover { background: #236038; }
  .btn-skip {
    background: transparent; color: var(--muted);
  }
  .btn-skip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-lt); }

  /* done state */
  .done-card {
    background: var(--green-lt);
    border: 1.5px solid #a8dab8;
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    text-align: center;
    margin-bottom: 1.25rem;
    display: none;
  }
  .done-icon { font-size: 2rem; margin-bottom: .5rem; }
  .done-text { font-size: 1rem; font-weight: 600; color: var(--green); }
  .done-sub  { font-size: .82rem; color: #5a9a6a; margin-top: .3rem; }
  .btn-new { margin-top: 1rem; padding: 9px 24px; background: var(--surface); border: 1.5px solid var(--border2); border-radius: var(--radius); font-family: var(--font); font-size: .88rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .15s; }
  .btn-new:hover { border-color: var(--accent); color: var(--accent); }

  /* history */
  .section-title { font-size: .72rem; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin-bottom: .75rem; }
  .history-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.75rem; }
  .history-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: .7rem 1rem;
  }
  .h-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .h-dot.skipped { background: var(--dim); }
  .h-name { flex: 1; font-size: .9rem; font-weight: 500; }
  .h-date { font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .h-badge { font-size: .68rem; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
  .h-badge.cooked { background: var(--green-lt); color: var(--green); }
  .h-badge.skipped { background: var(--surface2); color: var(--muted); }

  .empty-hist { text-align: center; padding: 1.5rem; color: var(--dim); font-size: .85rem; border: 1px dashed var(--border); border-radius: var(--radius); }

  /* meal list manager */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.25rem; }
  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .panel-header h3 { font-size: .9rem; font-weight: 600; }
  .toggle-btn { font-size: .78rem; color: var(--accent); background: none; border: none; cursor: pointer; font-family: var(--font); font-weight: 600; }
  .meal-tags { display: flex; flex-wrap: wrap; gap: 7px; }
  .meal-tag {
    display: flex; align-items: center; gap: 5px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 10px 4px 6px;
    font-size: .8rem;
  }
  .tag-del { background: none; border: none; cursor: pointer; color: var(--dim); font-size: .95rem; line-height: 1; transition: color .15s; padding: 0; }
  .tag-del:hover { color: var(--accent); }
  .add-meal-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-meal-row input {
    flex: 1; padding: 8px 11px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-family: var(--font); font-size: .88rem;
  }
  .add-meal-row input::placeholder { color: var(--dim); }
  .add-meal-row input:focus { outline: none; border-color: var(--accent); }
  .add-meal-row button {
    padding: 8px 14px; background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius); font-family: var(--font);
    font-size: .88rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .add-meal-row button:hover { background: #a8360a; }

  /* toast */
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(60px);
    background: var(--text); color: var(--bg); padding: 9px 20px;
    border-radius: 30px; font-size: .85rem; font-weight: 600;
    opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; white-space: nowrap; z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hidden { display: none !important; }

  @media (max-width: 420px) {
    header h1 { font-size: 1.6rem; }
    .meal-name { font-size: 1.4rem; }
    .actions { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="eyebrow">مطبخ اليوم</div>
    <h1>وجبة <span>اليوم</span></h1>
    <div class="date-badge" id="today-label"></div>
  </header>

  <!-- suggestion -->
  <div class="suggestion-card" id="suggestion-card">
    <div class="meal-label">الوجبة المقترحة لليوم</div>
    <div class="meal-name" id="meal-name">جاري الاختيار…</div>
    <div class="actions">
      <button class="btn btn-confirm" onclick="confirmMeal()">✓ تم الطبخ</button>
      <button class="btn btn-skip" onclick="skipMeal()">↻ وجبة ثانية</button>
    </div>
  </div>

  <!-- done state -->
  <div class="done-card" id="done-card">
    <div class="done-icon">🍽️</div>
    <div class="done-text" id="done-text"></div>
    <div class="done-sub">تم تسجيل الوجبة — لن تتكرر خلال 3 أيام</div>
    <button class="btn-new" onclick="resetDay()">اقتراح وجبة جديدة</button>
  </div>

  <!-- history -->
  <div class="section-title">آخر الوجبات</div>
  <div class="history-list" id="history-list"></div>

  <!-- meal manager -->
  <div class="panel">
    <div class="panel-header">
      <h3>قائمة الوجبات</h3>
      <button class="toggle-btn" onclick="toggleManager()">تعديل القائمة ▾</button>
    </div>
    <div id="manager-body" class="hidden">
      <div class="meal-tags" id="meal-tags"></div>
      <div class="add-meal-row">
        <input type="text" id="new-meal-input" placeholder="أضف وجبة جديدة…" autocomplete="off"/>
        <button onclick="addMeal()">+ إضافة</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_MEALS   = 'mealplanner_meals_v1';
const STORAGE_HISTORY = 'mealplanner_history_v1';
const BLOCK_DAYS      = 3;

const DEFAULT_MEALS = [
  'مكرونة بشاميل','كسكسي باللحم','شوربة دجاج','أرز بالدجاج',
  'مرقة لحم','فتة','بيض بالطماطم','مقلوبة','ملوخية','باستا بولونيز',
  'دجاج مشوي','شوربة عدس','فول مدمس','كبة مشوية','سمك مشوي',
  'هريسة','بازين','شوربة خضار','أرز بالخضار','دجاج بالزيتون'
];

let meals   = [];
let history = []; // [{name, datetime, cooked}]
let currentSuggestion = null;
let managerOpen = false;

function load() {
  try { meals   = JSON.parse(localStorage.getItem(STORAGE_MEALS))   || DEFAULT_MEALS.slice(); } catch(e) { meals = DEFAULT_MEALS.slice(); }
  try { history = JSON.parse(localStorage.getItem(STORAGE_HISTORY)) || []; } catch(e) { history = []; }
}
function saveMeals()   { localStorage.setItem(STORAGE_MEALS,   JSON.stringify(meals)); }
function saveHistory() { localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history)); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function todayStr() {
  return new Date().toLocaleDateString('ar-LY', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}

function recentlyUsed() {
  const cutoff = Date.now() - BLOCK_DAYS * 24 * 60 * 60 * 1000;
  return new Set(
    history
      .filter(h => h.cooked && new Date(h.datetime).getTime() > cutoff)
      .map(h => h.name)
  );
}

function suggest(exclude = new Set()) {
  const blocked = recentlyUsed();
  const pool = meals.filter(m => !blocked.has(m) && !exclude.has(m));
  if (!pool.length) {
    // all meals blocked — pick least recently used
    const fallback = meals.filter(m => !exclude.has(m));
    if (!fallback.length) return meals[0] || 'لا توجد وجبات';
    return fallback[Math.floor(Math.random() * fallback.length)];
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function pickAndShow(excludeSet = new Set()) {
  currentSuggestion = suggest(excludeSet);
  const el = document.getElementById('meal-name');
  el.classList.remove('animating');
  void el.offsetWidth;
  el.textContent = currentSuggestion;
  el.classList.add('animating');
  document.getElementById('suggestion-card').style.display = '';
  document.getElementById('done-card').style.display = 'none';
}

function confirmMeal() {
  if (!currentSuggestion) return;
  history.unshift({ name: currentSuggestion, datetime: new Date().toISOString(), cooked: true });
  saveHistory();
  document.getElementById('suggestion-card').style.display = 'none';
  const dc = document.getElementById('done-card');
  dc.style.display = '';
  document.getElementById('done-text').textContent = `تم طبخ: ${currentSuggestion} 🎉`;
  currentSuggestion = null;
  renderHistory();
}

function skipMeal() {
  const excluded = new Set(currentSuggestion ? [currentSuggestion] : []);
  if (currentSuggestion) {
    history.unshift({ name: currentSuggestion, datetime: new Date().toISOString(), cooked: false });
    saveHistory();
    renderHistory();
  }
  pickAndShow(excluded);
}

function resetDay() {
  pickAndShow();
}

function renderHistory() {
  const el = document.getElementById('history-list');
  const recent = history.slice(0, 10);
  if (!recent.length) {
    el.innerHTML = '<div class="empty-hist">لا توجد وجبات مسجّلة بعد</div>';
    return;
  }
  el.innerHTML = recent.map(h => {
    const d = new Date(h.datetime);
    const dateStr = d.toLocaleDateString('ar-LY', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    return `
      <div class="history-row">
        <div class="h-dot ${h.cooked ? '' : 'skipped'}"></div>
        <div class="h-name">${h.name}</div>
        <div class="h-date">${dateStr}</div>
        <span class="h-badge ${h.cooked ? 'cooked' : 'skipped'}">${h.cooked ? 'تم الطبخ' : 'تم التخطي'}</span>
      </div>`;
  }).join('');
}

function renderMealTags() {
  const el = document.getElementById('meal-tags');
  el.innerHTML = meals.map((m, i) => `
    <div class="meal-tag">
      <button class="tag-del" onclick="removeMeal(${i})" title="حذف">×</button>
      ${m}
    </div>`).join('');
}

function removeMeal(i) {
  meals.splice(i, 1);
  saveMeals();
  renderMealTags();
  showToast('تم حذف الوجبة');
}

function addMeal() {
  const inp = document.getElementById('new-meal-input');
  const name = inp.value.trim();
  if (!name) return;
  if (meals.includes(name)) { showToast('هذه الوجبة موجودة بالفعل'); return; }
  meals.push(name);
  saveMeals();
  inp.value = '';
  renderMealTags();
  showToast('✓ تمت الإضافة');
}

function toggleManager() {
  managerOpen = !managerOpen;
  const body = document.getElementById('manager-body');
  const btn  = document.querySelector('.toggle-btn');
  if (managerOpen) {
    body.classList.remove('hidden');
    btn.textContent = 'إغلاق القائمة ▴';
    renderMealTags();
  } else {
    body.classList.add('hidden');
    btn.textContent = 'تعديل القائمة ▾';
  }
}

document.getElementById('new-meal-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addMeal();
});

document.getElementById('today-label').textContent = todayStr();

load();
renderHistory();
pickAndShow();
</script>
</body>
</html>
